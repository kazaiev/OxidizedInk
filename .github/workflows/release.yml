# Builds a release's firmware files when a version tag (v0.1.0) is pushed,
# and attaches them to a GitHub release with the changelog's notes:
#   oxidized-ink-VERSION.bin       an update, for the Wi-Fi page or the card
#   oxidized-ink-VERSION-full.bin  bootloader, partition table and app, for
#                                  a first install over USB at offset 0
# Run by hand (workflow_dispatch), it builds the files without a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ESPFLASH: "4.6.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: espflash
        run: |
          curl -sfL -o espflash.zip https://github.com/esp-rs/espflash/releases/download/v${ESPFLASH}/espflash-x86_64-unknown-linux-gnu.zip
          unzip -q espflash.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
      - name: Build
        working-directory: firmware
        run: cargo build --release
      - name: Images
        working-directory: firmware
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          elf=target/xtensa-esp32-none-elf/release/inkreader
          mkdir -p ../dist
          espflash save-image --chip esp32 "$elf" "../dist/oxidized-ink-$version.bin"
          espflash save-image --chip esp32 --merge --skip-padding --partition-table partitions.csv "$elf" "../dist/oxidized-ink-$version-full.bin"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Notes
        run: |
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > dist/notes.md
          cat dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: oxidized-ink-${{ env.VERSION }}
          path: dist/*.bin
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: oxidized-ink ${{ env.VERSION }}
          body_path: dist/notes.md
          files: dist/*.bin

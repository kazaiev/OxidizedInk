# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32 --partition-table partitions.csv --erase-parts otadata"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32-none-elf"

[env]
# A TLSF heap: the default first-fit list slows down badly once a chapter's
# thousands of small blocks fragment it (12 s to set a large chapter
# while the last one is still held, instead of 2 s).
ESP_ALLOC_CONFIG_HEAP_ALGORITHM = "TLSF"

[unstable]
build-std = ["alloc", "core"]

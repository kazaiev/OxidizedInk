[package]
name = "inkreader-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent e-reader logic: EPUB parsing, layout, rendering and UI"

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
ab_glyph = { version = "0.2", default-features = false, features = ["libm"] }
libm = "0.2"
# English and Ukrainian patterns, about 48 KB. Each language is a feature.
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "english", "ukrainian"] }

[dev-dependencies]
png = "0.18.1"
